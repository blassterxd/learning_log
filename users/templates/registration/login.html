{% extends "learning_logs/base.html" %}
{% load static %}
{% block content %}
  <div class="row align-items-center justify-content-center g-4">
    <div class="col-md-3 text-center">
      <img src="{% static 'learning_logs/images/login1.jpg' %}"
           class="img-fluid rounded"
           style="max-height: 250px;"
           alt="Picture 1">
    </div>

    <div class="col-md-5">
      <h2 class="mb-3">Log in</h2>
      {% if form.errors %}
        <div class="alert alert-danger">Your username and password didn't match. Please try again.</div>
      {% endif %}
      <form method="post" action="{% url 'users:login' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button class="btn btn-primary" name="submit">Log in</button>
        <input type="hidden" name="next" value="{% url 'learning_logs:index' %}"/>
      </form>
    </div>

    <div class="col-md-3 text-center">
      <img src="{% static 'learning_logs/images/login2.jpg' %}"
           class="img-fluid rounded"
           style="max-height: 250px;"
           alt="Picture 2">
    </div>
  </div>
{% endblock content %}
