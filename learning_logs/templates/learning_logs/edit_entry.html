{% extends "learning_logs/base.html" %}
{% block content %}
  <h2 class="mb-3"><a href="{% url 'learning_logs:topic' topic.id %}">{{ topic }}</a></h2>
  <h4>Edit entry</h4>
  <form action="{% url 'learning_logs:edit_entry' entry.id %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" name="submit">Save changes</button>
    <a class="btn btn-outline-secondary" href="{% url 'learning_logs:topic' topic.id %}">Cancel</a>
  </form>
{% endblock content %}
