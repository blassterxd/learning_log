{% extends "learning_logs/base.html" %}
{% block content %}
  <h2 class="mb-3">Add a new topic</h2>
  <form action="{% url 'learning_logs:new_topic' %}" method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button class="btn btn-primary" name="submit">Add topic</button>
    <a class="btn btn-outline-secondary" href="{% url 'learning_logs:topics' %}">Cancel</a>
  </form>
{% endblock content %}
